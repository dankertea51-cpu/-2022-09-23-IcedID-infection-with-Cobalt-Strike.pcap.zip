title: Connection to IcedID phishing infrastructure (trallfasterinf.com)
id: 6f1c2a30-4b7e-4c21-9d55-1a9c0e7b2f01
status: experimental
description: >
  Detects DNS resolution of or network connection to trallfasterinf.com /
  137.184.114.20, observed in the 2022-09-23 IcedID + Cobalt Strike capture.
  The domain is flagged as phishing by 10 of 92 VirusTotal engines.
references:
  - https://www.malware-traffic-analysis.net/
author: DeqUser
date: 2026-03-26
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.initial_access
  - attack.t1566
logsource:
  category: dns_query
detection:
  dns_query:
    QueryName|contains: 'trallfasterinf.com'
  condition: dns_query
falsepositives:
  - None expected. The domain has no known legitimate use.
level: high
